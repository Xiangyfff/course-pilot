spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:course_planner}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:planner}
    password: ${DB_PASSWORD:planner}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

app:
  cache:
    mode: ${CACHE_MODE:caffeine}
